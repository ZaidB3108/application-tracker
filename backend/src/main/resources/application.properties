spring.application.name=application-tracker-api
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/applyflow_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
# This database already contains the application's tables. Do not let Hibernate
# create, change, or delete schema objects automatically.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
